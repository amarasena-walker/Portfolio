<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact | Disath Amarasena</title>
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;500;600;700&display=swap"
        rel="stylesheet">
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Boxicons -->
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#000000',
                        accent: '#FFD700',
                        secondary: '#ffffff',
                        'dark-teal': '#004D40',
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        display: ['Outfit', 'sans-serif'],
                    },
                    animation: {
                        'fade-in': 'fadeIn 0.8s ease-out forwards',
                        'slide-up': 'slideUp 0.8s ease-out forwards',
                    },
                    keyframes: {
                        fadeIn: {
                            '0%': { opacity: '0' },
                            '100%': { opacity: '1' },
                        },
                        slideUp: {
                            '0%': { opacity: '0', transform: 'translateY(30px)' },
                            '100%': { opacity: '1', transform: 'translateY(0)' },
                        },
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="style.css">
    <!-- Lenis for Smooth Scroll -->
    <script src="https://unpkg.com/lenis@1.1.9/dist/lenis.min.js"></script>
    <link rel="stylesheet" href="https://unpkg.com/lenis@1.1.9/dist/lenis.css">
</head>

<body class="bg-secondary text-primary font-sans overflow-x-hidden pt-20">
    <!-- Scroll Progress Bar -->
    <div id="progress-bar" class="fixed top-0 left-0 w-0 h-1 bg-accent z-[100] transition-all duration-100"></div>

    <!-- Navigation -->
    <nav class="fixed top-0 w-full z-50 bg-primary bg-opacity-90 backdrop-blur-md border-b border-white/10 transition-all duration-300"
        id="navbar">
        <div class="max-w-7xl mx-auto px-6 lg:px-12 py-4 flex justify-between items-center">
            <a href="index.html" class="text-accent font-display font-bold text-2xl tracking-tighter">DA</a>

            <div class="hidden md:flex space-x-10">
                <a href="index.html" class="text-white hover:text-accent font-medium transition-colors">Home</a>
                <a href="about.html" class="text-white hover:text-accent font-medium transition-colors">About</a>
                <a href="skills.html" class="text-white hover:text-accent font-medium transition-colors">Skills</a>
                <a href="portfolio.html"
                    class="text-white hover:text-accent font-medium transition-colors">Portfolio</a>
                <a href="contact.html" class="text-accent font-medium transition-colors">Contact</a>
            </div>

            <button class="md:hidden text-white" id="mobile-menu-btn">
                <i data-lucide="menu" class="w-8 h-8"></i>
            </button>
        </div>

        <div id="mobile-menu"
            class="hidden md:hidden absolute top-full left-0 w-full bg-primary border-b border-white/10 px-6 py-6 flex flex-col space-y-4">
            <a href="index.html" class="text-white text-lg font-medium">Home</a>
            <a href="about.html" class="text-white text-lg font-medium">About</a>
            <a href="skills.html" class="text-white text-lg font-medium">Skills</a>
            <a href="portfolio.html" class="text-white text-lg font-medium">Portfolio</a>
            <a href="contact.html" class="text-accent text-lg font-medium">Contact</a>
        </div>
    </nav>

    <!-- Social Sidebar -->
    <aside class="fixed right-6 bottom-10 z-40 hidden lg:flex flex-col items-center space-y-6">
        <a href="https://www.linkedin.com/in/disath-amarasena-a184a8355/" target="_blank" rel="noopener noreferrer"
            class="text-primary hover:text-accent transition-transform hover:scale-110"><i
                class='bx bxl-linkedin text-2xl'></i></a>
        <a href="https://www.instagram.com/amarasena_walker/" target="_blank" rel="noopener noreferrer"
            class="text-primary hover:text-accent transition-transform hover:scale-110"><i
                class='bx bxl-instagram text-2xl'></i></a>
        <div class="w-px h-24 bg-primary/20 mt-4"></div>
    </aside>

    <!-- Contact Section -->
    <section id="contact" class="flex flex-col md:flex-row bg-white min-h-screen">
        <!-- Contact Info -->
        <div class="flex-1 bg-primary text-white p-12 lg:p-24 flex flex-col justify-center reveal-on-scroll">
            <h2 class="text-4xl md:text-5xl font-display font-bold mb-12">Get in <br> Touch</h2>
            <div class="space-y-8">
                <div class="flex items-start space-x-6">
                    <div class="bg-white/10 p-4 rounded-xl">
                        <i data-lucide="mail" class="w-6 h-6 text-accent"></i>
                    </div>
                    <div>
                        <h4 class="font-bold text-lg mb-1">Email</h4>
                        <p class="text-white/60">disathamarasena308@gmail.com</p>
                    </div>
                </div>
                <div class="flex items-start space-x-6">
                    <div class="bg-white/10 p-4 rounded-xl">
                        <i data-lucide="map-pin" class="w-6 h-6 text-accent"></i>
                    </div>
                    <div>
                        <h4 class="font-bold text-lg mb-1">Location</h4>
                        <p class="text-white/60">Colombo, Sri Lanka</p>
                    </div>
                </div>
            </div>

            <div class="mt-20 flex space-x-6 md:hidden">
                <a href="https://www.linkedin.com/in/disath-amarasena-a184a8355/" target="_blank"
                    rel="noopener noreferrer" class="text-white hover:text-accent transition-colors"><i
                        class='bx bxl-linkedin text-2xl'></i></a>
                <a href="https://www.instagram.com/amarasena_walker/" target="_blank" rel="noopener noreferrer"
                    class="text-white hover:text-accent transition-colors"><i class='bx bxl-instagram text-2xl'></i></a>
            </div>
        </div>

        <!-- Form -->
        <div class="flex-1 p-12 lg:p-24 reveal-on-scroll flex flex-col justify-center">
            <form id="contact-form" class="space-y-8">
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-8">
                    <div class="flex flex-col">
                        <label for="first-name" class="font-bold text-sm mb-2">First Name</label>
                        <input type="text" id="first-name"
                            class="bg-gray-50 border-b border-gray-200 py-3 px-4 focus:outline-none focus:border-accent transition-colors"
                            placeholder="John">
                    </div>
                    <div class="flex flex-col">
                        <label for="last-name" class="font-bold text-sm mb-2">Last Name</label>
                        <input type="text" id="last-name"
                            class="bg-gray-50 border-b border-gray-200 py-3 px-4 focus:outline-none focus:border-accent transition-colors"
                            placeholder="Doe">
                    </div>
                </div>
                <div class="flex flex-col">
                    <label for="email" class="font-bold text-sm mb-2">Email</label>
                    <input type="email" id="email"
                        class="bg-gray-50 border-b border-gray-200 py-3 px-4 focus:outline-none focus:border-accent transition-colors"
                        placeholder="john@example.com">
                </div>
                <div class="flex flex-col">
                    <label for="message" class="font-bold text-sm mb-2">Message</label>
                    <textarea id="message" rows="5"
                        class="bg-gray-50 border-b border-gray-200 py-3 px-4 focus:outline-none focus:border-accent transition-colors resize-none"
                        placeholder="Tell me about your project..."></textarea>
                </div>
                <button type="submit"
                    class="w-full bg-dark-teal text-white py-4 rounded-full font-bold hover:bg-primary transition-colors duration-300">Send
                    Message</button>
            </form>
        </div>
    </section>

    <footer class="bg-primary py-12 text-center text-white/40 text-sm border-t border-white/5">
        <p>&copy; 2026 Disath Amarasena. All rights reserved. Designed with precision.</p>
    </footer>

    <!-- Back to Top Button -->
    <button id="back-to-top"
        class="fixed right-24 bottom-10 z-50 w-12 h-12 bg-accent text-primary rounded-full shadow-2xl flex items-center justify-center opacity-0 translate-y-10 transition-all duration-500 hover:bg-white hover:-translate-y-1">
        <i data-lucide="arrow-up" class="w-6 h-6"></i>
    </button>

    <script src="main.js"></script>
</body>

</html>
